/* Keep the CSS surface identical to the canvas coordinate system at every width. */
#world{inset:auto;top:0;left:50%;width:min(100vw,500px);height:100dvh;transform:translateX(-50%)}
header,#landing,#controls{left:max(26px,calc((100vw - 448px)/2));right:max(26px,calc((100vw - 448px)/2))}
#hud{right:max(26px,calc((100vw - 448px)/2))}
.paused-scene{left:max(26px,calc((100vw - 448px)/2))}

/* Arcade controls: cut metal frames, dark keys, illuminated edges. */
header{display:block;pointer-events:none;top:max(24px,env(safe-area-inset-top));height:92px}
header .logo{position:absolute;left:50%;top:0;margin:0;width:164px;height:82px;transform:translateX(-50%);background:none;color:inherit;filter:drop-shadow(0 0 12px #ff35ac55);font-size:initial;letter-spacing:normal}
.logo svg{display:block;width:100%;height:100%;overflow:visible}
.utilities{position:absolute;right:-8px;top:4px;display:flex;flex-direction:column;gap:10px;pointer-events:auto}
.utility{display:grid;place-items:center;width:42px;height:42px;min-height:42px;padding:0;border:1px solid #9a588775;border-radius:0;background:#140c2380;color:#d6aaca;font:20px monospace;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
#landing{display:flex;align-items:center;flex-direction:column;gap:22px;bottom:max(38px,env(safe-area-inset-bottom))}
.neon,#controls button,#stop{--edge:#ff4cbd;--shine:#ffc0e9;--cut:13px;position:relative;isolation:isolate;display:grid;place-items:center;background:transparent;border:0;border-radius:0;box-shadow:none;min-height:56px;padding:0 28px;color:#fff0fb;font-family:monospace;font-size:15px;font-weight:600;letter-spacing:4px;text-transform:uppercase;filter:drop-shadow(0 0 6px #ff34a655);transition:filter .16s,transform .12s}
.neon:before,.neon:after{content:"";position:absolute;z-index:-1;pointer-events:none;clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.neon:before{inset:0;background:linear-gradient(125deg,var(--shine),var(--edge) 25%,#752956 56%,var(--edge) 80%,var(--shine))}
.neon:after{inset:2px;background:linear-gradient(170deg,#2e1433,#100d20 55%,#20102c);box-shadow:inset 0 0 22px #ff3dbb1c}
.neon span{display:flex;align-items:center;justify-content:center;gap:16px;position:relative;text-shadow:0 0 10px var(--edge)}
.neon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
.neon:hover{filter:drop-shadow(0 0 12px #ff36b28c);color:white}
.neon:active{transform:translateY(2px);filter:drop-shadow(0 0 18px var(--edge))}
.neon:active:after{background:#44203f}
.neon:focus-visible{outline:2px solid #fff0fb;outline-offset:5px}
#landing :is(#start,.album){width:min(100%,320px);height:66px}
#start{font-size:19px;letter-spacing:6px}
#start svg{width:23px;height:23px;fill:#ffb3e0}
.neon.secondary{--edge:#48dbe9;--shine:#b1f6ff;width:min(100%,270px);min-height:50px;height:50px;margin:0;font-size:12px;letter-spacing:3px;filter:drop-shadow(0 0 5px #33c9e53d);color:#b7eef5}
.neon.secondary:after{background:linear-gradient(170deg,#112531,#0c101f 70%)}
#hud{top:max(30px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:12px}
#distance{font-size:20px;letter-spacing:1px;color:#eec9e5;text-shadow:0 0 9px #fe52bd}
#stop{margin:0;min-height:44px;padding:0 12px;font-size:11px;letter-spacing:2px;--cut:8px}
#controls{bottom:max(38px,env(safe-area-inset-bottom))}
#controls button{width:94px;height:66px;font-size:33px;padding:0;--edge:#6de6f4;--shine:#d3fbff;filter:drop-shadow(0 0 8px #28c5ee44)}
#controls button:after{background:linear-gradient(145deg,#153344,#0e1023 65%)}
#result section{display:flex;flex-direction:column;align-items:center;gap:14px}
#result h2{font-size:28px;margin:0}#result strong{font-size:40px;margin:0}#result p{font-size:12px;margin:0 0 10px}
#result .primary{max-width:320px}dialog .primary{height:54px}
dialog{border-radius:0;background:#110e23;border-color:#ff66c6;box-shadow:0 0 35px #c83b8640}

@font-face{font-family:NeonArcade;src:url('fonts/neon-arcade.ttf?v=2') format('truetype');font-display:swap}
.board-dialog{background:linear-gradient(165deg,#391431dd,#110d23 62%),repeating-linear-gradient(0deg,transparent 0 3px,#ff74cf0a 3px 4px);border-top:3px solid #ff79cd;border-bottom:2px solid #68e5f0;border-right:2px solid #68e5f0;box-shadow:0 0 32px #e42c9455,inset 0 0 28px #ff39af0c}
.board-dialog h2{font-family:NeonArcade,Score,sans-serif;color:#f4bbec;text-shadow:2px 2px 0 #86295b,0 0 17px #ff55bc80;border-bottom:1px solid #fb7ac955;padding-bottom:18px}
.board-dialog table{table-layout:fixed;font:400 14px/1.5 NeonArcade,Score,sans-serif;text-transform:uppercase;letter-spacing:.3px}
.board-dialog th{font:400 10px NeonArcade,Score,sans-serif;color:#c393b5;letter-spacing:1px;padding-bottom:14px}
.board-dialog th:first-child{width:27px}.board-dialog th:last-child{width:88px}
.board-dialog td{padding:13px 3px;border-bottom:1px solid #e26bba26;text-shadow:0 0 8px #ff63c644}
.board-dialog td:first-child{color:#ac83aa}
.board-dialog td:last-child{text-shadow:0 0 10px #66deed55}
.board-dialog tbody tr:first-child{background:linear-gradient(90deg,transparent 0%,#ff53b51a 35%,#ff53b51a 65%,transparent 100%)}
.board-dialog tbody tr:first-child td{color:#ffbbdf;text-shadow:0 0 12px #ff55ad66}
#player-name{font-family:NeonArcade,Score,sans-serif;letter-spacing:1px}#name-limit{font-size:11px;margin:7px 0 0;color:#bd93af}
@media(max-width:370px){.board-dialog{padding:23px 14px}.board-dialog table{font-size:12px}.board-dialog th:last-child{width:78px}}

#leaderboard-dialog{padding:18px 20px;max-height:90svh}
#leaderboard-dialog h2{font-size:23px;line-height:1.2;margin-bottom:12px;padding-bottom:12px}
#leaderboard-dialog table{margin:8px 0 12px;line-height:1.25}
#leaderboard-dialog th{padding:6px 3px 9px}
#leaderboard-dialog td{padding:6px 3px;font-family:NeonArcade,Score,sans-serif;font-size:inherit;letter-spacing:.3px}
#leaderboard-dialog .neon{margin-top:8px}
#leaderboard-message:empty{display:none}
@media(max-height:600px){#leaderboard-dialog{padding:14px 18px}#leaderboard-dialog td{padding-top:4px;padding-bottom:4px}}

#welcome {
  position: fixed;
  inset: 0;
  z-index: 99;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: radial-gradient(ellipse at center, #32142e 0%, #170c25 55%, #0b0715 100%);
}
#welcome:active { transform: none; }
#welcome:focus-visible { outline: none; }
#welcome:focus-visible .welcome-hand {
  outline: 2px solid #ffe2f7;
  outline-offset: 6px;
  border-radius: 8px;
}
.welcome-logo {
  width: min(68vw, 290px, 55vh);
  height: auto;
  overflow: visible;
  filter: drop-shadow(0 3px 1px #060c1e) drop-shadow(0 0 18px #9ddcff45);
}
.welcome-hand {
  position: absolute;
  top: calc(50% + min(15vw, 64px, 12vh) + 16px);
  width: 40px;
  height: 40px;
  color: #ffe2f7;
  filter: drop-shadow(0 0 9px #ff48b6);
}
</style></head><body>
<button type="button" id="welcome" hidden aria-label="32 — Enter and play music">
  <svg class="welcome-logo" viewBox="-15 -20 1800 800" aria-hidden="true"><use href="#logo32-art"/></svg>
  <svg class="welcome-hand" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 29V15a3 3 0 0 1 6 0v10a3 3 0 0 1 6 0v2a3 3 0 0 1 6 0v2a3 3 0 0 1 6 0v5c0 6-4 10-10 10h-6c-4 0-7-2-9-5l-5-7a3 3 0 0 1 5-4l1 1Z" fill="#22102d"/>
    <path d="M23 3v4M13 7l3 3M33 7l-3 3"/>
  </svg>
</button>
<div id="drive"><canvas id="world" aria-label="A neon sports car driving towards a striped sunset"></canvas><div id="vignette"></div><div class="vhs" aria-hidden="true"><div class="tracking"></div></div><header><h1 class="logo" aria-label="32"><svg viewBox="-15 -20 1800 800" aria-hidden="true"><defs>
<linearGradient id="silver32" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7fbff"/><stop offset=".18" stop-color="#b5c4d3"/><stop offset=".36" stop-color="#f4faff"/><stop offset=".47" stop-color="#8c9cab"/><stop offset=".495" stop-color="#253446"/><stop offset=".515" stop-color="#090f1b"/><stop offset=".54" stop-color="#e4f4ff"/><stop offset=".72" stop-color="#93acbe"/><stop offset=".9" stop-color="#edf8ff"/><stop offset="1" stop-color="#617a90"/></linearGradient>

<path d="M620 118h36m-18-18v36" stroke="#e6f8ff" stroke-width="5" opacity=".85"/></g></svg></h1><div class="utilities"><button class="utility sound" id="sound" aria-label="Turn music on" title="Music">♫</button><button id="leaderboard-open" class="utility" aria-label="Leaderboard" title="Leaderboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v6a5 5 0 0 1-10 0z M7 5H3v3a4 4 0 0 0 5 4 M17 5h4v3a4 4 0 0 1-5 4 M12 14v6 M8 21h8"/></svg></button><button id="stop" hidden class="neon"><span><i class="stop-mark" aria-hidden="true">Ⅱ</i><b>Stop</b></span></button></div></header><main id="landing"><button id="start" class="neon primary"><span><b>Start</b></span></button><button class="neon secondary album"><span><b>Photos</b></span></button></main><aside id="hud" hidden><div id="distance" aria-label="Distance in metres">00000</div></aside><nav id="controls" aria-label="Driving controls" hidden><button id="left" class="neon" aria-label="Move left"><span>←</span></button><div id="speedometer" aria-label="Speed 60 miles per hour"><svg viewBox="0 0 100 42" aria-hidden="true"><path class="speed-track" d="M8 36A43 43 0 0 1 92 36"/><path id="speed-arc" d="M8 36A43 43 0 0 1 92 36" pathLength="100"/></svg><div class="speed-reading"><strong id="speed-value">60</strong><span>MPH</span></div></div><button id="right" class="neon" aria-label="Move right"><span>→</span></button></nav><div id="result" hidden><section aria-label="Ride result"><strong id="score"><span class="score-value">0</span><span class="score-unit">m</span></strong><p id="best"></p><p id="leaderboard-status" role="status" hidden></p><button class="neon primary" id="retry"><span><b>Try again</b></span></button><button class="neon secondary" id="home"><span>Back</span></button></section></div><div id="device"><section id="rotate"><div style="font-size:50px">↻</div><h2>Keep it vertical.</h2><p>Rotate your phone to chase the sunset.</p></section></div><dialog id="album" aria-labelledby="album-title"><h2 id="album-title">Coming Soon</h2><button class="neon primary" id="close"><span>Back</span></button></dialog><dialog id="leaderboard-dialog" class="board-dialog" aria-labelledby="board-title"><h2 id="board-title">TOP 10</h2><p id="leaderboard-message" role="status"></p><table><thead><tr><th scope="col">#</th><th scope="col">Driver</th><th scope="col">Score</th></tr></thead><tbody id="leaderboard-rows"></tbody></table><button class="neon secondary" id="leaderboard-close"><span>Back</span></button></dialog><dialog id="name-dialog" class="board-dialog" aria-labelledby="name-title"><h2 id="name-title">TOP 10</h2><p>Your ride made the leaderboard.</p><strong id="name-score"></strong><form id="name-form"><label for="player-name">Your name</label><input id="player-name" name="name" maxlength="20" autocomplete="nickname" aria-describedby="name-limit" required><p id="name-limit">Up to 10 characters</p><p id="name-error" role="alert"></p><button id="name-submit" class="neon primary" type="submit"><span>OK</span></button><button id="name-skip" class="neon secondary" type="button"><span>Skip</span></button></form></dialog></div>
<script src="leaderboard.js"></script><script src="porsche.js?v=3"></script><script src="game.js?v=2"></script>
<script>
{
  const welcome = document.getElementById('welcome');
  const drive = document.getElementById('drive');
  const startButton = document.getElementById('start');
  const soundButton = document.getElementById('sound');

  if (typeof startButton.onclick === 'function' && typeof soundButton.onclick === 'function') {
    welcome.addEventListener('click', () => {
      welcome.hidden = true;
      drive.inert = false;
      startButton.focus({preventScroll: true});
      soundButton.click();
    }, {once: true});
    drive.inert = true;
    welcome.hidden = false;
  }
}
</script>
